<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sunflower Growth</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      background-color: #0b0f07;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      height: 100dvh;
      position: relative;
      background: url('bg.jpg') no-repeat center center;
      background-size: cover;
      overflow: hidden;
    }

    /* Верхние счетчики HUD */
    .hud-suns {
      position: absolute;
      top: 4.8%;
      left: 23%;
      width: 26%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #fff;
      font-size: 11px;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      z-index: 5;
    }

    .hud-stars {
      position: absolute;
      top: 4.8%;
      left: 53%;
      width: 18%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #fff;
      font-size: 11px;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      z-index: 5;
    }

    /* Кнопка "Собрать" */
    .collect-btn {
      position: absolute;
      top: 3.4%;
      right: 4.5%;
      width: 22.5%;
      height: 5.6%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: #fff;
      text-shadow: 1px 1px 0 #1b4d11;
      border-radius: 6px;
      z-index: 25;
      pointer-events: auto;
    }

    .collect-btn.disabled {
      filter: grayscale(85%) brightness(65%);
      cursor: not-allowed;
      color: #bbb;
      text-shadow: none;
    }

    /* Индикатор накопления */
    .storage-info {
      position: absolute;
      top: 17%;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      z-index: 5;
    }

    .pending-counter {
      font-size: 13px;
      color: #ffe600;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    }

    .income-tag {
      font-size: 9px;
      color: #fff;
      text-shadow: 1px 1px 0 #000;
    }

    /* Цветок */
    .flower-wrapper {
      position: absolute;
      top: calc(26% - 104px);
      left: 50%;
      transform: translateX(-50%);
      width: 210px;
      height: 374px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      pointer-events: none;
      z-index: 2;
    }

    .flower-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      image-rendering: pixelated;
      animation: floatIdle 2.5s ease-in-out infinite;
    }

    @keyframes floatIdle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Табличка названия */
    .flower-info {
      position: absolute;
      bottom: 21.6%;
      left: 10%;
      width: 80%;
      text-align: center;
      pointer-events: none;
      z-index: 5;
    }

    .tier-title {
      font-size: 8px;
      margin-bottom: 5px;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
    }

    .flower-title {
      font-size: 10px;
      color: #1e1308;
    }

    /* Нижние кнопки навигации */
    .nav-buttons {
      position: absolute;
      bottom: 2%;
      left: 4%;
      width: 92%;
      height: 11%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      z-index: 30;
    }

    .nav-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }

    /* Модальные окна */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.78);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-box {
      width: 100%;
      max-width: 350px;
      background: #6e4120;
      border: 4px solid #2a1506;
      border-radius: 8px;
      padding: 14px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 6px 0 #120902;
      z-index: 101;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      border-bottom: 2px solid #4a2810;
      padding-bottom: 6px;
    }

    .modal-close {
      cursor: pointer;
      font-size: 14px;
      color: #ff9494;
      padding: 4px 8px;
    }

    .tabs-row {
      display: flex;
      gap: 4px;
      margin-bottom: 4px;
    }

    .tab-btn {
      flex: 1;
      background: #462610;
      border: 2px solid #231206;
      color: #ccc;
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      padding: 6px 2px;
      cursor: pointer;
      border-radius: 4px;
    }

    .tab-btn.active {
      background: #8e582d;
      color: #fff;
      border-color: #ffd700;
    }

    .scroll-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .list-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #4a2912;
      border: 2px solid #231206;
      padding: 8px;
      border-radius: 6px;
      font-size: 7px;
    }

    .action-btn {
      background: #3e8e2b;
      border: 2px solid #1c4d11;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 4px;
    }

    .action-btn:disabled {
      background: #555;
      border-color: #333;
      cursor: not-allowed;
    }

    input {
      user-select: text;
      -webkit-user-select: text;
    }

    .promo-input {
      background: #2a1506;
      border: 2px solid #8e582d;
      color: #ffd700;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 10px;
      width: 100%;
      text-transform: uppercase;
      border-radius: 4px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="hud-suns">
      <span id="sunCount">0</span>
    </div>

    <div class="hud-stars">
      <span id="starCount">0</span>
    </div>

    <div class="collect-btn" id="claimBtn">Собрать</div>

    <div class="storage-info">
      <div class="pending-counter">Готово: +<span id="pendingCount">0.0</span> ☀️</div>
      <div class="income-tag"><span id="incomeRate">0.000</span>/сек</div>
    </div>

    <div class="flower-wrapper">
      <img id="plantSprite" src="gardener.png" class="flower-img" alt="Sunflower">
    </div>

    <div class="flower-info">
      <div class="tier-title" id="tierLabel" style="color: #4cd137;">Обычный (Common)</div>
      <div class="flower-title" id="nameLabel">Садовод</div>
    </div>

    <div class="nav-buttons">
      <button class="nav-btn" id="btnInv"></button>
      <button class="nav-btn" id="btnShop"></button>
      <button class="nav-btn" id="btnUpgrades"></button>
      <button class="nav-btn" id="btnEvents"></button>
    </div>

    <!-- Модалка: Инвентарь -->
    <div class="modal-overlay" id="inventoryModal">
      <div class="modal-box">
        <div class="modal-header">
          <span>Инвентарь</span>
          <span class="modal-close" id="closeInv">✕</span>
        </div>
        <div class="tabs-row">
          <button class="tab-btn active" id="tabFlowers">Цветы</button>
          <button class="tab-btn" id="tabSeeds">Семена</button>
          <button class="tab-btn" id="tabBoosts">Подкормка</button>
        </div>
        <div class="scroll-list" id="invList"></div>
        <button class="action-btn" id="btnOpenPromo" style="background:#b33939; margin-top:4px;">🔑 Ввести промокод</button>
      </div>
    </div>

    <!-- Модалка: Улучшения -->
    <div class="modal-overlay" id="upgradesModal">
      <div class="modal-box">
        <div class="modal-header">
          <span>Улучшения</span>
          <span class="modal-close" id="closeUpgrades">✕</span>
        </div>
        <div class="scroll-list" id="upgradesList"></div>
      </div>
    </div>

    <!-- Модалка: Магазин -->
    <div class="modal-overlay" id="shopModal">
      <div class="modal-box">
        <div class="modal-header">
          <span>Магазин ⭐</span>
          <span class="modal-close" id="closeShop">✕</span>
        </div>
        <div class="scroll-list" id="shopList"></div>
      </div>
    </div>

    <!-- Модалка: Промокоды -->
    <div class="modal-overlay" id="promoModal">
      <div class="modal-box">
        <div class="modal-header">
          <span>Промокод из TG</span>
          <span class="modal-close" id="closePromo">✕</span>
        </div>
        <input type="text" id="promoInput" class="promo-input" placeholder="ВВЕДИТЕ КОД">
        <button class="action-btn" id="btnApplyPromo">Активировать</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    function notify(msg) {
      try {
        if (tg && tg.showAlert && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')) { tg.showAlert(msg); return; }
      } catch (e) {}
      window.alert(msg);
    }

    // Адрес твоего сервера оплаты (Cloudflare Worker), см. инструкцию
    const BACKEND_URL = 'https://sunflower-pay.kirillkallistratov752.workers.dev';

    const ALL_FLOWERS = {
      gardener: { id: 'gardener', name: 'Садовод', tier: 'Обычный (Common)', tierKey: 'common', color: '#4cd137', baseRate: 0.1, img: 'gardener.png', fallbackFilter: 'hue-rotate(199deg) saturate(1.5)' },
      miner: { id: 'miner', name: 'Шахтёр', tier: 'Обычный (Common)', tierKey: 'common', color: '#4cd137', baseRate: 0.1, img: 'miner.png', fallbackFilter: 'hue-rotate(279deg) saturate(1.5)' },
      cook: { id: 'cook', name: 'Повар', tier: 'Обычный (Common)', tierKey: 'common', color: '#4cd137', baseRate: 0.1, img: 'cook.png', fallbackFilter: 'hue-rotate(201deg) saturate(1.5)' },
      fisher: { id: 'fisher', name: 'Рыбак', tier: 'Обычный (Common)', tierKey: 'common', color: '#4cd137', baseRate: 0.11, img: 'fisher.png', fallbackFilter: 'hue-rotate(313deg) saturate(1.5)' },
      farmer: { id: 'farmer', name: 'Фермер', tier: 'Обычный (Common)', tierKey: 'common', color: '#4cd137', baseRate: 0.12, img: 'farmer.png', fallbackFilter: 'hue-rotate(275deg) saturate(1.5)' },
      postman: { id: 'postman', name: 'Почтальон', tier: 'Обычный (Common)', tierKey: 'common', color: '#4cd137', baseRate: 0.12, img: 'postman.png', fallbackFilter: 'hue-rotate(42deg) saturate(1.5)' },
      painter: { id: 'painter', name: 'Художник', tier: 'Обычный (Common)', tierKey: 'common', color: '#4cd137', baseRate: 0.13, img: 'painter.png', fallbackFilter: 'hue-rotate(131deg) saturate(1.5)' },
      camper: { id: 'camper', name: 'Турист', tier: 'Обычный (Common)', tierKey: 'common', color: '#4cd137', baseRate: 0.14, img: 'camper.png', fallbackFilter: 'hue-rotate(328deg) saturate(1.5)' },
      lumberjack: { id: 'lumberjack', name: 'Лесоруб', tier: 'Обычный (Common)', tierKey: 'common', color: '#4cd137', baseRate: 0.15, img: 'lumberjack.png', fallbackFilter: 'hue-rotate(32deg) saturate(1.5)' },
      pirate: { id: 'pirate', name: 'Пират', tier: 'Необычный (Uncommon)', tierKey: 'uncommon', color: '#00a8ff', baseRate: 0.16, img: 'pirate.png', fallbackFilter: 'hue-rotate(39deg) saturate(1.5)' },
      knight: { id: 'knight', name: 'Рыцарь', tier: 'Необычный (Uncommon)', tierKey: 'uncommon', color: '#00a8ff', baseRate: 0.17, img: 'knight.png', fallbackFilter: 'hue-rotate(322deg) saturate(1.5)' },
      ninja: { id: 'ninja', name: 'Ниндзя', tier: 'Необычный (Uncommon)', tierKey: 'uncommon', color: '#00a8ff', baseRate: 0.18, img: 'ninja.png', fallbackFilter: 'hue-rotate(259deg) saturate(1.5)' },
      cowboy: { id: 'cowboy', name: 'Ковбой', tier: 'Необычный (Uncommon)', tierKey: 'uncommon', color: '#00a8ff', baseRate: 0.19, img: 'cowboy.png', fallbackFilter: 'hue-rotate(45deg) saturate(1.5)' },
      viking: { id: 'viking', name: 'Викинг', tier: 'Необычный (Uncommon)', tierKey: 'uncommon', color: '#00a8ff', baseRate: 0.2, img: 'viking.png', fallbackFilter: 'hue-rotate(322deg) saturate(1.5)' },
      diver: { id: 'diver', name: 'Дайвер', tier: 'Необычный (Uncommon)', tierKey: 'uncommon', color: '#00a8ff', baseRate: 0.22, img: 'diver.png', fallbackFilter: 'hue-rotate(106deg) saturate(1.5)' },
      detective: { id: 'detective', name: 'Детектив', tier: 'Необычный (Uncommon)', tierKey: 'uncommon', color: '#00a8ff', baseRate: 0.24, img: 'detective.png', fallbackFilter: 'hue-rotate(40deg) saturate(1.5)' },
      scientist: { id: 'scientist', name: 'Учёный', tier: 'Необычный (Uncommon)', tierKey: 'uncommon', color: '#00a8ff', baseRate: 0.25, img: 'scientist.png', fallbackFilter: 'hue-rotate(300deg) saturate(1.5)' },
      fire: { id: 'fire', name: 'Огненный', tier: 'Редкий (Rare)', tierKey: 'rare', color: '#e1b12c', baseRate: 0.3, img: 'fire.png', fallbackFilter: 'hue-rotate(151deg) saturate(1.5)' },
      ice: { id: 'ice', name: 'Ледяной', tier: 'Редкий (Rare)', tierKey: 'rare', color: '#e1b12c', baseRate: 0.32, img: 'ice.png', fallbackFilter: 'hue-rotate(168deg) saturate(1.5)' },
      storm: { id: 'storm', name: 'Грозовой', tier: 'Редкий (Rare)', tierKey: 'rare', color: '#e1b12c', baseRate: 0.35, img: 'storm.png', fallbackFilter: 'hue-rotate(199deg) saturate(1.5)' },
      spirit: { id: 'spirit', name: 'Лесной дух', tier: 'Редкий (Rare)', tierKey: 'rare', color: '#e1b12c', baseRate: 0.38, img: 'spirit.png', fallbackFilter: 'hue-rotate(259deg) saturate(1.5)' },
      candy: { id: 'candy', name: 'Сладкий', tier: 'Редкий (Rare)', tierKey: 'rare', color: '#e1b12c', baseRate: 0.4, img: 'candy.png', fallbackFilter: 'hue-rotate(125deg) saturate(1.5)' },
      disco: { id: 'disco', name: 'Диско', tier: 'Редкий (Rare)', tierKey: 'rare', color: '#e1b12c', baseRate: 0.42, img: 'disco.png', fallbackFilter: 'hue-rotate(267deg) saturate(1.5)' },
      ghost: { id: 'ghost', name: 'Призрак', tier: 'Редкий (Rare)', tierKey: 'rare', color: '#e1b12c', baseRate: 0.45, img: 'ghost.png', fallbackFilter: 'hue-rotate(284deg) saturate(1.5)' },
      cyber: { id: 'cyber', name: 'Кибер-подсолнух', tier: 'Эпический (Epic)', tierKey: 'epic', color: '#9c88ff', baseRate: 0.5, img: 'cyber.png', fallbackFilter: 'hue-rotate(260deg) saturate(1.5)' },
      dragon: { id: 'dragon', name: 'Драконий', tier: 'Эпический (Epic)', tierKey: 'epic', color: '#9c88ff', baseRate: 0.55, img: 'dragon.png', fallbackFilter: 'hue-rotate(297deg) saturate(1.5)' },
      steampunk: { id: 'steampunk', name: 'Стимпанк', tier: 'Эпический (Epic)', tierKey: 'epic', color: '#9c88ff', baseRate: 0.65, img: 'steampunk.png', fallbackFilter: 'hue-rotate(112deg) saturate(1.5)' },
      crystal: { id: 'crystal', name: 'Кристальный', tier: 'Эпический (Epic)', tierKey: 'epic', color: '#9c88ff', baseRate: 0.75, img: 'crystal.png', fallbackFilter: 'hue-rotate(173deg) saturate(1.5)' },
      shadow: { id: 'shadow', name: 'Теневой', tier: 'Эпический (Epic)', tierKey: 'epic', color: '#9c88ff', baseRate: 0.9, img: 'shadow.png', fallbackFilter: 'hue-rotate(134deg) saturate(1.5)' },
      cosmic: { id: 'cosmic', name: 'Космический', tier: 'Легендарный (Legendary)', tierKey: 'legendary', color: '#fbc531', baseRate: 1.5, img: 'cosmic.png', fallbackFilter: 'hue-rotate(45deg) saturate(1.5)' },
      golden: { id: 'golden', name: 'Золотой король', tier: 'Легендарный (Legendary)', tierKey: 'legendary', color: '#fbc531', baseRate: 2.2, img: 'golden.png', fallbackFilter: 'hue-rotate(47deg) saturate(1.5)' },
      worldtree: { id: 'worldtree', name: 'Мировое древо', tier: 'Мифический (Mythic)', tierKey: 'mythic', color: '#ff4757', baseRate: 4.5, img: 'worldtree.png', fallbackFilter: 'hue-rotate(249deg) saturate(1.5)' }
    };

    // Шанс выпадения из семечка по редкости (в сумме 100)
    const TIER_WEIGHTS = { common: 45, uncommon: 25, rare: 15, epic: 9, legendary: 5, mythic: 1 };

    function pickRandomFlower() {
      let roll = Math.random() * 100;
      let tier = 'common';
      for (const t in TIER_WEIGHTS) {
        if (roll < TIER_WEIGHTS[t]) { tier = t; break; }
        roll -= TIER_WEIGHTS[t];
      }
      const pool = Object.values(ALL_FLOWERS).filter(f => f.tierKey === tier);
      return pool[Math.floor(Math.random() * pool.length)].id;
    }

    let state = {
      suns: 0,
      starsSpent: 0,
      activeFlowerId: 'gardener',
      ownedFlowers: ['gardener'],
      seeds: { standard: 1 },
      fertilizers: 1,
      boostTimer: 0,
      upgrades: { pot: 0, sprout: 0, sunlight: 0 },
      activatedPromos: []
    };

    const saved = localStorage.getItem('pvz_sunflower_save');
    if (saved) {
      try { Object.assign(state, JSON.parse(saved)); } catch(e){}
    }

    function saveState() {
      localStorage.setItem('pvz_sunflower_save', JSON.stringify(state));
    }

    let pendingSuns = 0;
    let cooldown = 0;
    const COOLDOWN_MAX = 15;
    let currentInvTab = 'flowers';

    function calcIncome() {
      const active = ALL_FLOWERS[state.activeFlowerId] || ALL_FLOWERS.gardener;
      const base = active.baseRate;
      const bonus = (state.upgrades.pot * 0.001) + 
                    (state.upgrades.sprout * 0.01) + 
                    (state.upgrades.sunlight * 0.1);
      const mult = state.boostTimer > 0 ? 2 : 1;
      return (base + bonus) * mult;
    }

    setInterval(() => {
      const rate = calcIncome();
      pendingSuns += rate;

      if (state.boostTimer > 0) state.boostTimer--;

      if (cooldown > 0) {
        cooldown--;
        const btn = document.getElementById('claimBtn');
        if (cooldown === 0) {
          btn.classList.remove('disabled');
          btn.innerText = 'Собрать';
        } else {
          btn.innerText = `${cooldown}с`;
        }
      }

      document.getElementById('pendingCount').innerText = pendingSuns.toFixed(1);
      document.getElementById('incomeRate').innerText = rate.toFixed(3);
      document.getElementById('sunCount').innerText = Math.floor(state.suns);
      document.getElementById('starCount').innerText = state.starsSpent;
    }, 1000);

    function claimSuns() {
      if (cooldown > 0) return;
      if (pendingSuns < 0.1) {
        notify('Пока нечего собирать!');
        return;
      }

      state.suns += pendingSuns;
      pendingSuns = 0;
      cooldown = COOLDOWN_MAX;

      const btn = document.getElementById('claimBtn');
      btn.classList.add('disabled');
      btn.innerText = `${cooldown}с`;

      saveState();
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    function updateActiveDisplay() {
      const flower = ALL_FLOWERS[state.activeFlowerId] || ALL_FLOWERS.gardener;
      const sprite = document.getElementById('plantSprite');
      sprite.style.filter = '';
      sprite.onerror = () => {
        sprite.onerror = null;
        sprite.style.filter = flower.fallbackFilter || '';
        sprite.src = 'gardener.png';
      };
      sprite.src = flower.img;
      document.getElementById('nameLabel').innerText = flower.name;
      document.getElementById('tierLabel').innerText = flower.tier;
      document.getElementById('tierLabel').style.color = flower.color;
    }

    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function switchInvTab(tab) {
      currentInvTab = tab;
      ['Flowers', 'Seeds', 'Boosts'].forEach(t => {
        document.getElementById(`tab${t}`).classList.remove('active');
      });
      document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.add('active');

      const list = document.getElementById('invList');
      list.innerHTML = '';

      if (tab === 'flowers') {
        const owned = state.ownedFlowers.filter(id => ALL_FLOWERS[id])
          .sort((x, y) => ALL_FLOWERS[y].baseRate - ALL_FLOWERS[x].baseRate);
        owned.forEach(id => {
          const f = ALL_FLOWERS[id];
          const isCurrent = state.activeFlowerId === id;
          const card = document.createElement('div');
          card.className = 'list-card';
          card.innerHTML = `
            <div>
              <div style="color:${f.color}">${f.name}</div>
              <div style="font-size:6px; color:#aaa; margin-top:4px">${f.tier}</div>
              <div style="font-size:6px; color:#aaa; margin-top:3px">+${f.baseRate}/с</div>
            </div>
          `;
          const btn = document.createElement('button');
          btn.className = 'action-btn';
          btn.innerText = isCurrent ? 'В саду' : 'Выбрать';
          btn.disabled = isCurrent;
          btn.onclick = () => {
            state.activeFlowerId = f.id;
            updateActiveDisplay();
            saveState();
            switchInvTab('flowers');
          };
          card.appendChild(btn);
          list.appendChild(card);
        });
      } else if (tab === 'seeds') {
        const card = document.createElement('div');
        card.className = 'list-card';
        card.innerHTML = `
          <div>
            <div>Таинственное семечко</div>
            <div style="font-size:6px; color:#aaa">В наличии: ${state.seeds.standard || 0} шт.</div>
          </div>
        `;
        const btn = document.createElement('button');
        btn.className = 'action-btn';
        btn.innerText = 'Посадить';
        btn.disabled = !state.seeds.standard;
        btn.onclick = () => {
          state.seeds.standard--;
          const wonId = pickRandomFlower();

          if (!state.ownedFlowers.includes(wonId)) {
            state.ownedFlowers.push(wonId);
          }
          state.activeFlowerId = wonId;
          updateActiveDisplay();
          saveState();
          notify(`🎉 Вы вырастили: ${ALL_FLOWERS[wonId].name}!`);
          switchInvTab('flowers');
        };
        card.appendChild(btn);
        list.appendChild(card);
      } else if (tab === 'boosts') {
        const card = document.createElement('div');
        card.className = 'list-card';
        card.innerHTML = `
          <div>
            <div>Удобрение (x2 на 60с)</div>
            <div style="font-size:6px; color:#aaa">В наличии: ${state.fertilizers} шт.</div>
          </div>
        `;
        const btn = document.createElement('button');
        btn.className = 'action-btn';
        btn.innerText = 'Применить';
        btn.disabled = state.fertilizers <= 0;
        btn.onclick = () => {
          state.fertilizers--;
          state.boostTimer = 60;
          saveState();
          notify('⚡ Подкормка активна: доход x2 на 60 секунд!');
          switchInvTab('boosts');
        };
        card.appendChild(btn);
        list.appendChild(card);
      }
    }

    function renderUpgrades() {
      const list = document.getElementById('upgradesList');
      list.innerHTML = '';
      const u = state.upgrades;
      const upgradesData = [
        { key: 'pot', name: 'Горшочек', rate: '+0.001/с', cost: Math.floor(15 * Math.pow(1.3, u.pot)), lvl: u.pot },
        { key: 'sprout', name: 'Росток', rate: '+0.01/с', cost: Math.floor(80 * Math.pow(1.35, u.sprout)), lvl: u.sprout },
        { key: 'sunlight', name: 'Солнечный свет', rate: '+0.1/с', cost: Math.floor(400 * Math.pow(1.4, u.sunlight)), lvl: u.sunlight }
      ];

      upgradesData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'list-card';
        card.innerHTML = `
          <div>
            <div>${item.name} [${item.lvl}]</div>
            <div style="font-size:6px; color:#ffe600">${item.rate} | ${item.cost}☀️</div>
          </div>
        `;
        const btn = document.createElement('button');
        btn.className = 'action-btn';
        btn.innerText = 'Купить';
        btn.onclick = () => {
          if (state.suns >= item.cost) {
            state.suns -= item.cost;
            state.upgrades[item.key]++;
            saveState();
            renderUpgrades();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          } else {
            notify('Недостаточно солнышек!');
          }
        };
        card.appendChild(btn);
        list.appendChild(card);
      });
    }

    // Цены только для показа. Реальную цену берёт сервер (worker.js)
    const SHOP_ITEMS = [
      { key: 'seed', name: 'Таинственное семечко', desc: 'Шанс на редкий цветок', stars: 25 },
      { key: 'fert', name: 'Подкормка x3', desc: 'x2 доход, 3 штуки', stars: 25 }
    ];

    let buying = false;

    function grantItem(key, stars) {
      if (key === 'seed') state.seeds.standard = (state.seeds.standard || 0) + 1;
      if (key === 'fert') state.fertilizers += 3;
      state.starsSpent += stars;
      saveState();
      document.getElementById('starCount').innerText = state.starsSpent;
    }

    async function buyWithStars(item) {
      if (buying) return;
      if (!tg || !tg.openInvoice || !tg.initData) {
        notify('Покупки работают только внутри Telegram');
        return;
      }
      if (BACKEND_URL.includes('YOUR-WORKER')) {
        notify('Сервер оплаты ещё не подключён');
        return;
      }
      buying = true;
      try {
        const r = await fetch(BACKEND_URL + '/invoice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ item: item.key })
        });
        const d = await r.json();
        if (!d.link) throw new Error('no link');

        tg.openInvoice(d.link, (status) => {
          buying = false;
          if (status === 'paid') {
            grantItem(item.key, item.stars);
            notify('✅ Спасибо за покупку!');
          } else if (status === 'failed') {
            notify('Оплата не прошла');
          }
        });
      } catch (e) {
        buying = false;
        notify('Не удалось создать счёт, попробуй позже');
      }
    }

    function renderShop() {
      const list = document.getElementById('shopList');
      list.innerHTML = '<div style="font-size:6px; color:#ffe600; line-height:1.6">Первое семечко бесплатно — оно уже у тебя. Дальше за Telegram Stars.</div>';

      SHOP_ITEMS.forEach(item => {
        const card = document.createElement('div');
        card.className = 'list-card';
        card.innerHTML = `
          <div>
            <div>${item.name}</div>
            <div style="font-size:6px; color:#aaa; margin:4px 0">${item.desc}</div>
            <div style="font-size:6px; color:#ffe600">${item.stars} ⭐</div>
          </div>
        `;
        const btn = document.createElement('button');
        btn.className = 'action-btn';
        btn.innerText = 'Купить';
        btn.onclick = () => buyWithStars(item);
        card.appendChild(btn);
        list.appendChild(card);
      });
    }

    // Слушатели событий
    document.getElementById('claimBtn').onclick = claimSuns;
    document.getElementById('btnInv').onclick = () => { switchInvTab(currentInvTab); openModal('inventoryModal'); };
    document.getElementById('btnShop').onclick = () => { renderShop(); openModal('shopModal'); };
    document.getElementById('btnUpgrades').onclick = () => { renderUpgrades(); openModal('upgradesModal'); };
    document.getElementById('btnEvents').onclick = () => notify('🏆 Ивенты откроются в следующем обновлении!');

    document.getElementById('closeInv').onclick = () => closeModal('inventoryModal');
    document.getElementById('closeUpgrades').onclick = () => closeModal('upgradesModal');
    document.getElementById('closeShop').onclick = () => closeModal('shopModal');
    document.getElementById('closePromo').onclick = () => closeModal('promoModal');

    document.getElementById('tabFlowers').onclick = () => switchInvTab('flowers');
    document.getElementById('tabSeeds').onclick = () => switchInvTab('seeds');
    document.getElementById('tabBoosts').onclick = () => switchInvTab('boosts');

    document.getElementById('btnOpenPromo').onclick = () => {
      closeModal('inventoryModal');
      openModal('promoModal');
    };

    // Промокоды: измени/добавь свои
    const PROMOS = {
      'SUNFLOWER': { seeds: 1 },
      'START':     { fertilizers: 2 },
      'GIFT':      { seeds: 1 }
    };

    document.getElementById('btnApplyPromo').onclick = () => {
      const input = document.getElementById('promoInput');
      const code = input.value.trim().toUpperCase();
      if (!code) return;
      if (state.activatedPromos.includes(code)) { notify('Этот код уже активирован!'); return; }
      const reward = PROMOS[code];
      if (!reward) { notify('Неверный промокод'); return; }

      if (reward.seeds) state.seeds.standard = (state.seeds.standard || 0) + reward.seeds;
      if (reward.fertilizers) state.fertilizers += reward.fertilizers;
      state.activatedPromos.push(code);
      saveState();
      input.value = '';
      closeModal('promoModal');
      notify('🎁 Промокод активирован!');
    };

    // Закрытие модалок по тапу на тёмный фон
    document.querySelectorAll('.modal-overlay').forEach(ov => {
      ov.addEventListener('click', e => { if (e.target === ov) ov.style.display = 'none'; });
    });

    updateActiveDisplay();
    document.getElementById('sunCount').innerText = Math.floor(state.suns);
    document.getElementById('starCount').innerText = state.starsSpent;
  </script>
</body>
</html>
