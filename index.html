<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sunflower Growth</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f07;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      position: relative;
      background: url('bg.jpg') no-repeat center center;
      background-size: cover;
      overflow: hidden;
    }

    /* Верхние счетчики HUD под фон */
    .hud-suns {
      position: absolute;
      top: 4.8%;
      left: 23%;
      width: 26%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #fff;
      font-size: 11px;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
    }

    .hud-stars {
      position: absolute;
      top: 4.8%;
      left: 53%;
      width: 18%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #fff;
      font-size: 11px;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
    }

    /* Кнопка "Собрать" с кулдауном */
    .collect-btn {
      position: absolute;
      top: 3.4%;
      right: 4.5%;
      width: 22.5%;
      height: 5.6%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: #fff;
      text-shadow: 1px 1px 0 #1b4d11;
      border-radius: 6px;
    }

    .collect-btn.disabled {
      filter: grayscale(85%) brightness(65%);
      cursor: not-allowed;
      color: #bbb;
      text-shadow: none;
    }

    /* Накопление в горшке над цветком */
    .storage-info {
      position: absolute;
      top: 17%;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
    }

    .pending-counter {
      font-size: 13px;
      color: #ffe600;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    }

    .income-tag {
      font-size: 9px;
      color: #fff;
      text-shadow: 1px 1px 0 #000;
    }

    /* Подсолнух в горшке (клики отключены) */
    .flower-wrapper {
      position: absolute;
      top: 26%;
      left: 50%;
      transform: translateX(-50%);
      width: 210px;
      height: 270px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      pointer-events: none;
    }

    .flower-img {
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      animation: floatIdle 2.5s ease-in-out infinite;
    }

    @keyframes floatIdle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Нижняя дощечка с названием */
    .flower-info {
      position: absolute;
      bottom: 21.6%;
      left: 10%;
      width: 80%;
      text-align: center;
      pointer-events: none;
    }

    .tier-title {
      font-size: 8px;
      margin-bottom: 5px;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
    }

    .flower-title {
      font-size: 10px;
      color: #1e1308;
    }

    /* Нижние кнопки навигации */
    .nav-buttons {
      position: absolute;
      bottom: 2%;
      left: 4%;
      width: 92%;
      height: 11%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      cursor: pointer;
    }

    /* Модальные окна */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.78);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-box {
      width: 100%;
      max-width: 350px;
      background: #6e4120;
      border: 4px solid #2a1506;
      border-radius: 8px;
      padding: 14px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 6px 0 #120902;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      border-bottom: 2px solid #4a2810;
      padding-bottom: 6px;
    }

    .modal-close {
      cursor: pointer;
      font-size: 14px;
      color: #ff9494;
      padding: 2px 6px;
    }

    .tabs-row {
      display: flex;
      gap: 4px;
      margin-bottom: 4px;
    }

    .tab-btn {
      flex: 1;
      background: #462610;
      border: 2px solid #231206;
      color: #ccc;
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      padding: 6px 2px;
      cursor: pointer;
      border-radius: 4px;
    }

    .tab-btn.active {
      background: #8e582d;
      color: #fff;
      border-color: #ffd700;
    }

    .scroll-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .list-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #4a2912;
      border: 2px solid #231206;
      padding: 8px;
      border-radius: 6px;
      font-size: 7px;
    }

    .action-btn {
      background: #3e8e2b;
      border: 2px solid #1c4d11;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 4px;
    }

    .action-btn:disabled {
      background: #555;
      border-color: #333;
      cursor: not-allowed;
    }

    .promo-input {
      background: #2a1506;
      border: 2px solid #8e582d;
      color: #ffd700;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 10px;
      width: 100%;
      text-transform: uppercase;
      border-radius: 4px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- Счётчики вверху -->
    <div class="hud-suns">
      <span id="sunCount">0</span>
    </div>

    <div class="hud-stars">
      <span id="starCount">0</span>
    </div>

    <!-- Кнопка "Собрать" с откатом -->
    <div class="collect-btn" id="claimBtn" onclick="claimSuns()">Собрать</div>

    <!-- Сколько накоплено в горшке и текущий доход -->
    <div class="storage-info">
      <div class="pending-counter">Готово: +<span id="pendingCount">0.0</span> ☀️</div>
      <div class="income-tag"><span id="incomeRate">0.000</span>/сек</div>
    </div>

    <!-- Цветок -->
    <div class="flower-wrapper">
      <img id="plantSprite" src="gardener.png" class="flower-img" alt="Sunflower">
    </div>

    <!-- Название цветка -->
    <div class="flower-info">
      <div class="tier-title" id="tierLabel" style="color: #4cd137;">Обычный (Common)</div>
      <div class="flower-title" id="nameLabel">Садовод</div>
    </div>

    <!-- 4 кнопки меню -->
    <div class="nav-buttons">
      <button class="nav-btn" onclick="openInventory()"></button>
      <button class="nav-btn" onclick="openShop()"></button>
      <button class="nav-btn" onclick="openUpgrades()"></button>
      <button class="nav-btn" onclick="openEvents()"></button>
    </div>

    <!-- ОКНО: ИНВЕНТАРЬ -->
    <div class="modal-overlay" id="inventoryModal">
      <div class="modal-box">
        <div class="modal-header">
          <span>Инвентарь</span>
          <span class="modal-close" onclick="closeModal('inventoryModal')">✕</span>
        </div>

        <div class="tabs-row">
          <button class="tab-btn active" id="tabFlowers" onclick="switchInvTab('flowers')">Цветы</button>
          <button class="tab-btn" id="tabSeeds" onclick="switchInvTab('seeds')">Семена</button>
          <button class="tab-btn" id="tabBoosts" onclick="switchInvTab('boosts')">Подкормка</button>
        </div>

        <div class="scroll-list" id="invList"></div>

        <button class="action-btn" style="background:#b33939; margin-top:4px;" onclick="openPromoModal()">🔑 Ввести промокод</button>
      </div>
    </div>

    <!-- ОКНО: УЛУЧШЕНИЯ -->
    <div class="modal-overlay" id="upgradesModal">
      <div class="modal-box">
        <div class="modal-header">
          <span>Улучшения</span>
          <span class="modal-close" onclick="closeModal('upgradesModal')">✕</span>
        </div>
        <div class="scroll-list" id="upgradesList"></div>
      </div>
    </div>

    <!-- ОКНО: МАГАЗИН ЗВЕЗД -->
    <div class="modal-overlay" id="shopModal">
      <div class="modal-box">
        <div class="modal-header">
          <span>Магазин за ⭐</span>
          <span class="modal-close" onclick="closeModal('shopModal')">✕</span>
        </div>
        <div class="scroll-list" id="shopList"></div>
      </div>
    </div>

    <!-- ОКНО: КОДЫ -->
    <div class="modal-overlay" id="promoModal">
      <div class="modal-box">
        <div class="modal-header">
          <span>Промокод из TG</span>
          <span class="modal-close" onclick="closeModal('promoModal')">✕</span>
        </div>
        <input type="text" id="promoInput" class="promo-input" placeholder="ВВЕДИТЕ КОД">
        <button class="action-btn" onclick="applyPromo()">Активировать</button>
      </div>
    </div>

  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // Реестр цветов
    const ALL_FLOWERS = {
      gardener: { id: 'gardener', name: 'Садовод', tier: 'Обычный (Common)', color: '#4cd137', baseRate: 0.1, img: 'gardener.png' },
      cyber: { id: 'cyber', name: 'Кибер-подсолнух', tier: 'Эпический (Epic)', color: '#9c88ff', baseRate: 0.5, img: 'cyber.png' },
      cosmic: { id: 'cosmic', name: 'Космический', tier: 'Легендарный (Legendary)', color: '#fbc531', baseRate: 1.5, img: 'cosmic.png' }
    };

    // Данные аккаунта
    let state = {
      suns: 0,
      stars: 5,
      activeFlowerId: 'gardener',
      ownedFlowers: ['gardener'],
      seeds: { standard: 1 }, // 1 бесплатное семечко на старте
      fertilizers: 1,
      boostTimer: 0,
      upgrades: {
        pot: 0,      // +0.001
        sprout: 0,   // +0.01
        sunlight: 0  // +0.1
      },
      activatedPromos: []
    };

    const saved = localStorage.getItem('pvz_sunflower_save');
    if (saved) {
      try { Object.assign(state, JSON.parse(saved)); } catch(e){}
    }

    function saveState() {
      localStorage.setItem('pvz_sunflower_save', JSON.stringify(state));
    }

    let pendingSuns = 0;
    let cooldown = 0;
    const COOLDOWN_MAX = 15;
    let currentInvTab = 'flowers';

    // Формула: (база + горшок*0.001 + росток*0.01 + свет*0.1) * подкормка
    function calcIncome() {
      const active = ALL_FLOWERS[state.activeFlowerId] || ALL_FLOWERS.gardener;
      const base = active.baseRate;
      const bonus = (state.upgrades.pot * 0.001) + 
                    (state.upgrades.sprout * 0.01) + 
                    (state.upgrades.sunlight * 0.1);
      const mult = state.boostTimer > 0 ? 2 : 1;
      return (base + bonus) * mult;
    }

    // Игровой цикл каждую секунду
    setInterval(() => {
      const rate = calcIncome();
      pendingSuns += rate;

      if (state.boostTimer > 0) state.boostTimer--;

      if (cooldown > 0) {
        cooldown--;
        const btn = document.getElementById('claimBtn');
        if (cooldown === 0) {
          btn.classList.remove('disabled');
          btn.innerText = 'Собрать';
        } else {
          btn.innerText = `${cooldown}с`;
        }
      }

      document.getElementById('pendingCount').innerText = pendingSuns.toFixed(1);
      document.getElementById('incomeRate').innerText = rate.toFixed(3);
      document.getElementById('sunCount').innerText = Math.floor(state.suns);
      document.getElementById('starCount').innerText = state.stars;
    }, 1000);

    // Сбор накопленных солнц
    function claimSuns() {
      if (cooldown > 0) return;
      if (pendingSuns < 0.1) {
        alert('Пока нечего собирать!');
        return;
      }

      state.suns += pendingSuns;
      pendingSuns = 0;
      cooldown = COOLDOWN_MAX;

      const btn = document.getElementById('claimBtn');
      btn.classList.add('disabled');
      btn.innerText = `${cooldown}с`;

      saveState();
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    function updateActiveDisplay() {
      const flower = ALL_FLOWERS[state.activeFlowerId] || ALL_FLOWERS.gardener;
      document.getElementById('plantSprite').src = flower.img;
      document.getElementById('nameLabel').innerText = flower.name;
      document.getElementById('tierLabel').innerText = flower.tier;
      document.getElementById('tierLabel').style.color = flower.color;
    }

    // ИНВЕНТАРЬ
    function openInventory() {
      switchInvTab(currentInvTab);
      document.getElementById('inventoryModal').style.display = 'flex';
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }

    function switchInvTab(tab) {
      currentInvTab = tab;
      ['Flowers', 'Seeds', 'Boosts'].forEach(t => {
        document.getElementById(`tab${t}`).classList.remove('active');
      });
      document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.add('active');

      const list = document.getElementById('invList');
      list.innerHTML = '';

      if (tab === 'flowers') {
        state.ownedFlowers.forEach(id => {
          const f = ALL_FLOWERS[id];
          const isCurrent = state.activeFlowerId === id;
          list.innerHTML += `
            <div class="list-card">
              <div>
                <div style="color:${f.color}">${f.name}</div>
                <div style="font-size:6px; color:#aaa">+${f.baseRate}/с</div>
              </div>
              <button class="action-btn" onclick="selectFlower('${f.id}')" ${isCurrent ? 'disabled' : ''}>
                ${isCurrent ? 'В саду' : 'Выбрать'}
              </button>
            </div>
          `;
        });
      } else if (tab === 'seeds') {
        list.innerHTML = `
          <div class="list-card">
            <div>
              <div>Таинственное семечко</div>
              <div style="font-size:6px; color:#aaa">В наличии: ${state.seeds.standard || 0} шт.</div>
            </div>
            <button class="action-btn" onclick="plantSeed()" ${(!state.seeds.standard) ? 'disabled' : ''}>
              Посадить
            </button>
          </div>
        `;
      } else if (tab === 'boosts') {
        list.innerHTML = `
          <div class="list-card">
            <div>
              <div>Удобрение (x2 на 60с)</div>
              <div style="font-size:6px; color:#aaa">В наличии: ${state.fertilizers} шт.</div>
            </div>
l            <button class="action-btn" onclick="useFertilizer()" ${state.fertilizers <= 0 ? 'disabled' : ''}>
              Применить
            </button>
          </div>
        `;
      }
    }

    function selectFlower(id) {
      state.activeFlowerId = id;
      updateActiveDisplay();
      saveState();
      switchInvTab('flowers');
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }

    function plantSeed() {
      if (state.seeds.standard <= 0) return;
      state.seeds.standard--;

      const roll = Math.random() * 100;
      let wonId = 'gardener';
      if (roll <= 10) wonId = 'cosmic';
      else if (roll <= 35) wonId = 'cyber';

      if (!state.ownedFlowers.includes(wonId)) {
        state.ownedFlowers.push(wonId);
      }
      state.activeFlowerId = wonId;
      updateActiveDisplay();
      saveState();
      alert(`🎉 Вы вырастили: ${ALL_FLOWERS[wonId].name}!`);
      switchInvTab('flowers');
    }

    function useFertilizer() {
      if (state.fertilizers <= 0) return;
      state.fertilizers--;
      state.boostTimer = 60;
      saveState();
      alert('⚡ Подкормка активна: доход x2 на 60 секунд!');
      switchInvTab('boosts');
    }

    // УЛУЧШЕНИЯ
    function openUpgrades() {
      const list = document.getElementById('upgradesList');
      const u = state.upgrades;
      const costPot = Math.floor(15 * Math.pow(1.3, u.pot));
      const costSprout = Math.floor(80 * Math.pow(1.35, u.sprout));
      const costLight = Math.floor(400 * Math.pow(1.4, u.sunlight));

      list.innerHTML = `
        <div class="list-card">
          <div>
            <div>Горшочек [${u.pot}]</div>
            <div style="font-size:6px; color:#ffe600">+0.001/с | ${costPot}☀️</div>
          </div>
          <button class="action-btn" onclick="buyUpgrade('pot', ${costPot})">Купить</button>
        </div>
        <div class="list-card">
          <div>
            <div>Росток [${u.sprout}]</div>
            <div style="font-size:6px; color:#ffe600">+0.01/с | ${costSprout}☀️</div>
          </div>
          <button class="action-btn" onclick="buyUpgrade('sprout', ${costSprout})">Купить</button>
        </div>
        <div class="list-card">
          <div>
            <div>Солнечный свет [${u.sunlight}]</div>
            <div style="font-size:6px; color:#ffe600">+0.1/с | ${costLight}☀️</div>
          </div>
          <button class="action-btn" onclick="buyUpgrade('sunlight', ${costLight})">Купить</button>
        </div>
