<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sunflower Growth</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #111;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      position: relative;
      background: url('bg.jpg') no-repeat center center;
      background-size: cover;
      overflow: hidden;
    }

    /* HUD */
    .hud-suns {
      position: absolute;
      top: 4.8%;
      left: 23%;
      display: flex;
      align-items: center;
      gap: 5px;
      color: #fff;
      font-size: 13px;
      text-shadow: 2px 2px 0 #000;
    }

    .hud-stars {
      position: absolute;
      top: 4.8%;
      left: 54%;
      display: flex;
      align-items: center;
      gap: 5px;
      color: #fff;
      font-size: 13px;
      text-shadow: 2px 2px 0 #000;
    }

    /* Кнопка сбора с защитой от кликеров */
    .collect-btn {
      position: absolute;
      top: 3.5%;
      right: 5%;
      width: 22%;
      height: 5.5%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: #fff;
      text-shadow: 1px 1px 0 #1b4d11;
      transition: all 0.2s;
    }

    .collect-btn.disabled {
      filter: grayscale(80%) brightness(70%);
      cursor: not-allowed;
      color: #ccc;
      text-shadow: none;
    }

    /* Индикатор дохода */
    .income-tag {
      position: absolute;
      top: 21%;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 14px;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    }

    /* Анимация подсолнуха (только визуал, клики не дают валюту) */
    .flower-wrapper {
      position: absolute;
      top: 27%;
      left: 50%;
      transform: translateX(-50%);
      width: 190px;
      height: 250px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      pointer-events: none; /* Полностью блокирует клики по цветку */
    }

    .flower-img {
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      animation: floatIdle 2.5s ease-in-out infinite;
    }

    @keyframes floatIdle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Табличка названия */
    .flower-info {
      position: absolute;
      bottom: 21.5%;
      left: 10%;
      width: 80%;
      text-align: center;
      pointer-events: none;
    }

    .tier-title {
      font-size: 9px;
      margin-bottom: 4px;
    }

    .flower-title {
      font-size: 10px;
      color: #1a1a1a;
    }

    /* Нижние кнопки */
    .nav-buttons {
      position: absolute;
      bottom: 2%;
      left: 4%;
      width: 92%;
      height: 11%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      cursor: pointer;
    }

    /* Окно Инвентаря / Склада */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-box {
      width: 100%;
      max-width: 340px;
      background: #7a4b26;
      border: 4px solid #2d1808;
      border-radius: 8px;
      padding: 16px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 6px 0 #1b0e04;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    .modal-close {
      cursor: pointer;
      font-size: 14px;
      color: #ffb4b4;
    }

    .inventory-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
    }

    .inventory-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #5a3619;
      border: 2px solid #2d1808;
      padding: 8px;
      border-radius: 6px;
      font-size: 8px;
    }

    .select-btn {
      background: #469b32;
      border: 2px solid #1e4a13;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      padding: 6px 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- Счетчики -->
    <div class="hud-suns">
      <span>☀️</span>
      <span id="sunCount">100</span>
    </div>

    <div class="hud-stars">
      <span>⭐</span>
      <span id="starCount">0</span>
    </div>

    <!-- Защищенная кнопка сбора с кулдауном -->
    <div class="collect-btn" id="claimBtn" onclick="claimSuns()">Собрать</div>

    <div class="income-tag">
      <span id="incomeRate">1.2</span>/сек ☀️
    </div>

    <!-- Подсолнух (без кликов) -->
    <div class="flower-wrapper">
      <img id="plantSprite" src="gardener.png" class="flower-img" alt="Sunflower">
    </div>

    <div class="flower-info">
      <div class="tier-title" id="tierLabel" style="color: #4cd137;">Обычный (Common)</div>
      <div class="flower-title" id="nameLabel">Садовод</div>
    </div>

    <!-- Навигация -->
    <div class="nav-buttons">
      <button class="nav-btn" onclick="openInventory()"></button>
      <button class="nav-btn" onclick="alert('Магазин откроется в следующем обновлении!')"></button>
      <button class="nav-btn" onclick="alert('Улучшения в разработке!')"></button>
      <button class="nav-btn" onclick="alert('Ивенты скоро!')"></button>
    </div>

    <!-- Модальное окно склада -->
    <div class="modal-overlay" id="inventoryModal">
      <div class="modal-box">
        <div class="modal-header">
          <span>Склад цветов</span>
          <span class="modal-close" onclick="closeInventory()">✕</span>
        </div>
        <div class="inventory-list" id="inventoryContainer">
          <!-- Сюда подгружаются доступные подсолнухи -->
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // Список подсолнухов на складе
    const FLOWERS = [
      { id: 'gardener', name: 'Садовод', tier: 'Обычный (Common)', color: '#4cd137', rate: 1.2, img: 'gardener.png' },
      { id: 'cyber', name: 'Кибер-подсолнух', tier: 'Эпический (Epic)', color: '#9c88ff', rate: 4.5, img: 'cyber.png' },
      { id: 'cosmic', name: 'Космический', tier: 'Легендарный (Legendary)', color: '#fbc531', rate: 9.0, img: 'cosmic.png' }
    ];

    let currentFlower = FLOWERS[0];
    let totalSuns = 100;
    let pendingSuns = 0; // Солнца, накопленные в хранилище горшка
    let cooldownSeconds = 0;
    const COOLDOWN_TIME = 15; // 15 секунд задержки между сборами

    // Таймер пассивного дохода и кулдауна
    setInterval(() => {
      // Накопление в горшок
      pendingSuns += currentFlower.rate;

      // Таймер отката сбора
      if (cooldownSeconds > 0) {
        cooldownSeconds--;
        const btn = document.getElementById('claimBtn');
        if (cooldownSeconds === 0) {
          btn.classList.remove('disabled');
          btn.innerText = 'Собрать';
        } else {
          btn.innerText = `${cooldownSeconds}с`;
        }
      }
    }, 1000);

    // Сбор валюты
    function claimSuns() {
      if (cooldownSeconds > 0) return;

      const collected = Math.floor(pendingSuns);
      totalSuns += collected;
      pendingSuns = 0;

      document.getElementById('sunCount').innerText = totalSuns;

      // Запуск 15-секундного отката
      cooldownSeconds = COOLDOWN_TIME;
      const btn = document.getElementById('claimBtn');
      btn.classList.add('disabled');
      btn.innerText = `${cooldownSeconds}с`;

      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    // Открытие склада
    function openInventory() {
      const container = document.getElementById('inventoryContainer');
      container.innerHTML = '';

      FLOWERS.forEach(flower => {
        const item = document.createElement('div');
        item.className = 'inventory-item';
        item.innerHTML = `
          <div>
            <div style="color: ${flower.color};">${flower.name}</div>
            <div style="font-size: 7px; color: #ccc;">+${flower.rate}/сек</div>
          </div>
          <button class="select-btn" onclick="selectFlower('${flower.id}')">
            ${currentFlower.id === flower.id ? 'В саду' : 'Выбрать'}
          </button>
        `;
        container.appendChild(item);
      });

      document.getElementById('inventoryModal').style.display = 'flex';
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }

    function closeInventory() {
      document.getElementById('inventoryModal').style.display = 'none';
    }

    // Смена цветка в горшке
    function selectFlower(id) {
      const found = FLOWERS.find(f => f.id === id);
      if (found) {
        currentFlower = found;
        document.getElementById('plantSprite').src = found.img;
        document.getElementById('nameLabel').innerText = found.name;
        document.getElementById('tierLabel').innerText = found.tier;
        document.getElementById('tierLabel').style.color = found.color;
        document.getElementById('incomeRate').innerText = found.rate;
        closeInventory();
      }
    }
  </script>
</body>
</html>
